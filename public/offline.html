<!DOCTYPE html>
<html lang="bg">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Няма връзка · ДГ „Пролет“</title>
  <meta name="theme-color" content="#faca04">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #cfe9f8; color: #2e2e2e;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px;
    }
    main { max-width: 440px; width: 100%; background: #fffef9; border: 2px solid #e6cf67; border-top: 5px solid #faca04; border-radius: 12px; padding: 32px 28px; box-shadow: 0 4px 14px rgba(61, 47, 0, 0.08); }
    img { width: 52px; height: 52px; }
    h1 { margin-top: 18px; font-size: 22px; line-height: 1.3; color: #c43d00; }
    p { margin-top: 10px; font-size: 15px; line-height: 1.6; color: #2e2e2e; }
    ul { margin-top: 14px; padding-left: 20px; font-size: 14px; line-height: 1.7; color: #44403c; }
    button {
      margin-top: 24px; width: 100%; padding: 12px 20px; border: 0; border-radius: 2px 10px 2px 10px;
      background: #4d7a0a; color: #fff; font-size: 15px; font-weight: 700; cursor: pointer;
    }
    button:hover { background: #c43d00; }
    button:focus-visible { outline: 2px solid #4d7a0a; outline-offset: 2px; }
  </style>
</head>
<body>
  <main>
    <img src="/icon-192.png" alt="" width="52" height="52">
    <h1>Няма връзка с интернет</h1>
    <p>Тази страница още не е отваряна на устройството, затова не е запазена за работа без интернет.</p>
    <ul>
      <li>Страниците, които вече сте отваряли, се показват и без връзка.</li>
      <li>Генерирането на игри и план-конспекти и общата библиотека изискват интернет.</li>
    </ul>
    <button type="button" onclick="location.reload()">Опитай отново</button>
  </main>
</body>
</html>
